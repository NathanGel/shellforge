name: Tests

on:
  push:
    branches: [master, ci-test]
  pull_request:
    branches: [master]

jobs:
  python-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: api/library/python/iterm2
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        working-directory: api/library/python/iterm2
        run: python -m pytest tests/ -v

      - name: Run mypy
        working-directory: api/library/python/iterm2
        run: python -m mypy iterm2/

  feedback-relay-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run relay tests
        run: node --test
        working-directory: Shellforge/feedback-relay

  # Shellforge's helper and its Swift package, in one macOS job: a free account gets few macOS
  # runners at once, and two jobs here waited for one until GitHub gave up.
  # The helper reads ttys and peer pids the macOS way, and some of its tests run only there; its
  # README's dev install is the package with its `dev` extras. `swift.sh` insists on the Swift that
  # `Shellforge/.swift-version` pins, from swiftly, as a release build does.
  shellforge-macos-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the helper with its dev extras
        run: pip install -e 'Shellforge/daemon[dev]'

      - name: Run the helper's tests
        working-directory: Shellforge/daemon
        # As test-all.sh runs them: no bytecode and no pytest cache in the helper's folder.
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider

      - name: Install swiftly and the pinned Swift
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          ~/.swiftly/bin/swiftly install --use "$(cat Shellforge/.swift-version)"

      - name: Run the package tests
        # Also when the helper's tests failed: one red step should not hide the other's result.
        if: ${{ !cancelled() }}
        working-directory: Shellforge
        run: scripts/swift.sh test

  xcode-tests:
    runs-on: xcode-27
    # Disabled 2026-09-17: the committed prebuilt binary deps were built with
    # local Xcode 27.0 (27A266a), but GitHub's xcode-27 preview runner ships
    # Xcode 27 beta 6 (27A5252f), a different build, so the toolchain gate in
    # the "Build binary dependencies" script phase always fails. Re-enable
    # once the preview runner has a matching build, or the deps are rebuilt
    # to match whatever build the runner has.
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 27
        # Pin to the same Xcode the committed prebuilt binary dependencies were
        # built with. The build phase hard-fails (exit 1) unless `xcodebuild
        # -version` matches last-xcode-version byte for byte, so the build
        # number has to line up, not just the marketing version.
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Kill orphan Xcode processes
        run: |
          killall ibtoold 2>/dev/null || true
          killall AssetCatalogSimulatorAgent 2>/dev/null || true

      - name: Configure AI live harness for offline cassette replay
        run: |
          # The ModernTests scheme includes AILiveHarness, which is opt-in and
          # skips itself unless this config file exists. Write it in replay
          # mode so the harness runs entirely from the committed cassettes
          # (ModernTests/Resources/AICassettes) instead of hitting vendor APIs.
          # Keys are dummies on purpose: canonicalization replaces the key with
          # <SECRET> so any non-empty value matches the recorded request, and
          # replay never makes a network call, so if a request isn't cached the
          # test fails loudly rather than silently spending money. PROJECT_ROOT
          # lets the harness find the cassettes and the on-disk fixtures.
          cat > /tmp/iterm2-ai-live.json <<JSON
          {
            "OPENAI_API_KEY": "sk-dummy-ci",
            "ANTHROPIC_API_KEY": "sk-ant-dummy-ci",
            "GEMINI_API_KEY": "dummy-ci",
            "DEEPSEEK_API_KEY": "sk-dummy-ci",
            "LLAMA_API_KEY": "ollama-dummy-ci",
            "CASSETTE_MODE": "replay",
            "PROJECT_ROOT": "${GITHUB_WORKSPACE}"
          }
          JSON
          chmod 0600 /tmp/iterm2-ai-live.json
          echo "Wrote AI live cassette-replay config (PROJECT_ROOT=$GITHUB_WORKSPACE)"

      - name: Run tests
        run: |
          # Retry up to 3 times, but only for flaky ibtoold/asset catalog crashes
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            rm -rf TestResults.xcresult build_output.txt

            # Run xcodebuild and capture output
            set +e
            xcodebuild test \
              -project iTerm2.xcodeproj \
              -scheme ModernTests \
              -parallel-testing-enabled NO \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_output.txt
            # tee always exits 0, so $? here is tee's, not xcodebuild's. Use
            # PIPESTATUS[0] to get xcodebuild's real exit code, otherwise a
            # build/test failure masquerades as a pass.
            exit_code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ $exit_code -eq 0 ]; then
              echo "Tests passed on attempt $attempt"
              exit 0
            fi

            # Check if this is a flaky ibtoold/asset catalog crash
            if grep -q "CompileAssetCatalogVariant failed\|IBPlatformToolFailureException\|The tool closed the connection" build_output.txt; then
              echo "::warning::Attempt $attempt failed due to flaky ibtoold crash (known Xcode 26 issue)"
              if [ $attempt -lt 3 ]; then
                echo "Retrying..."
                killall ibtoold 2>/dev/null || true
                killall AssetCatalogSimulatorAgent 2>/dev/null || true
                sleep 5
                continue
              else
                echo "::error::All 3 attempts failed due to flaky ibtoold crashes"
                exit 1
              fi
            else
              # Real test failure - don't retry
              echo "::error::Tests failed (not a flaky ibtoold issue)"
              exit 1
            fi
          done

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
