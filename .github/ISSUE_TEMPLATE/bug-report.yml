name: Bug report
description: Something Shellforge does wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, step by step.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Screenshots help. Leave out tokens, hostnames and anything private.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shellforge version
      description: Shellforge › About Shellforge
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
